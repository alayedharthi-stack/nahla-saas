server {
    listen       3000;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Embedded iframe support (CRITICAL for Salla/Zid) ────────────────────────
    # Salla loads our app inside an iframe at https://s.salla.sa/embedded/...
    # If we send X-Frame-Options or omit frame-ancestors, the browser blocks
    # framing and Salla shows "لم يتم الاتصال بالتطبيق".
    #
    # CSP frame-ancestors supersedes X-Frame-Options in modern browsers.
    # We allow Salla, Zid, and our own origin only. Any other site embedding
    # nahlah.ai will be blocked by the browser.
    #
    # IMPORTANT:
    #   • DO NOT also send `X-Frame-Options DENY/SAMEORIGIN` — it would override.
    #   • SameSite=None cookies are NOT used; we use localStorage tokens.
    add_header Content-Security-Policy
        "frame-ancestors 'self' https://*.salla.sa https://salla.sa https://*.salla.dev https://*.zid.sa https://zid.sa"
        always;

    # Explicitly remove any X-Frame-Options that an upstream proxy might inject.
    # nginx cannot "remove" headers from upstream — but we can override here.
    # If any platform (Railway/Cloudflare) injects X-Frame-Options: DENY, set
    # `proxy_hide_header X-Frame-Options` at the proxy layer too.

    # ── Proxy settings ──────────────────────────────────────────────────────────
    proxy_ssl_server_name     on;
    proxy_ssl_verify          off;
    proxy_read_timeout        120s;
    proxy_connect_timeout     30s;
    proxy_send_timeout        120s;
    proxy_request_buffering   off;

    # ── Backend API routes (proxied to api.nahlah.ai) ───────────────────────────
    # These handle requests that arrive at this nginx server directly
    # (e.g. internal health probes, webhook callbacks from WhatsApp/Salla).
    # Normal browser-side SPA fetch() calls go directly to api.nahlah.ai
    # via VITE_API_BASE — they do NOT pass through this nginx.

    location /health {
        proxy_pass https://api.nahlah.ai/health;
        proxy_set_header Host             api.nahlah.ai;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /webhook/ {
        proxy_pass https://api.nahlah.ai/webhook/;
        proxy_set_header Host             api.nahlah.ai;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /oauth/ {
        proxy_pass https://api.nahlah.ai/oauth/;
        proxy_set_header Host             api.nahlah.ai;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Static assets — long cache ──────────────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Re-emit CSP for assets too (some browsers require it on every response)
        add_header Content-Security-Policy
            "frame-ancestors 'self' https://*.salla.sa https://salla.sa https://*.salla.dev https://*.zid.sa https://zid.sa"
            always;
    }

    # ── React SPA (everything else) ─────────────────────────────────────────────
    # CRITICAL: any path not matched above falls back to index.html so React
    # Router handles /app/salla, /app/entry, /invite/:code, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy
            "frame-ancestors 'self' https://*.salla.sa https://salla.sa https://*.salla.dev https://*.zid.sa https://zid.sa"
            always;
    }
}
