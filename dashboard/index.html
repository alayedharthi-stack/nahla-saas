<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Static fallback SEO values for non-JS crawlers only.
      Runtime route metadata is applied from publicSeo.ts before React mounts.
      COMPANY_INFO cannot be consumed here, so these values are duplicated intentionally.
    -->
    <title>Nahlah AI | AI-powered WhatsApp Sales Platform</title>
    <meta
      name="description"
      content="Nahlah AI is an AI-powered WhatsApp sales platform that helps merchants automate customer conversations, orders, and support."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نحلة" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-startup-image" href="/logo.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- Open Graph (static fallback; no canonical — SPA routes are set in JS) -->
    <meta property="og:title" content="Nahlah AI | AI-powered WhatsApp Sales Platform" />
    <meta
      property="og:description"
      content="Nahlah AI is an AI-powered WhatsApp sales platform that helps merchants automate customer conversations, orders, and support."
    />
    <meta property="og:image" content="https://nahlah.ai/logo.png" />
    <meta property="og:image:alt" content="Nahlah AI logo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nahlah.ai/" />
    <meta property="og:site_name" content="Nahlah AI" />
    <meta property="og:locale" content="ar_SA" />

    <!-- Twitter (static fallback) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nahlah AI | AI-powered WhatsApp Sales Platform" />
    <meta
      name="twitter:description"
      content="Nahlah AI is an AI-powered WhatsApp sales platform that helps merchants automate customer conversations, orders, and support."
    />
    <meta name="twitter:image" content="https://nahlah.ai/logo.png" />
    <meta name="twitter:image:alt" content="Nahlah AI logo" />

    <!-- Fonts: Cairo (Arabic primary) + Inter (English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Salla embedded handshake — fires IMMEDIATELY when the iframe HTML loads,
      before React even bundles.  Salla's host frame shows
      "لم يتم الاتصال بالتطبيق" if app.ready doesn't arrive within ~5s.
      We send both event shapes (legacy + current SDK) and re-send at 1s/3s.
    -->
    <script>
      (function () {
        if (window.parent === window) return; // not in an iframe
        var send = function () {
          try {
            window.parent.postMessage(
              { event: 'embedded::ready', payload: {}, timestamp: Date.now(),
                source: 'embedded-app', metadata: { version: '0.2.4' } },
              '*'
            );
          } catch (e) {}
          try { window.parent.postMessage({ event: 'app.ready', type: 'app.ready' }, '*'); } catch (e) {}
        };
        send();
        setTimeout(send, 600);
        setTimeout(send, 2000);
        setTimeout(send, 5000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Skip SW inside Salla iframe to avoid first-load races
          if (window.parent !== window) return;
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
