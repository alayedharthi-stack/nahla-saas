<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Shopify connection return — runs before any other script or
         subresource. Mirrors src/lib/shopifyConnection/returnCapture.ts
         (normalizeRoutePath, RETURN_MARKER_RE); keep them in sync.
         - Completion page in any form React Router renders it (any case,
           percent-encoded, repeated or trailing slashes): send no referrer,
           move the raw fragment into memory behind a one-shot getter and
           replace the URL with the canonical bare path.
         - Any other path whose query or fragment carries a Shopify return
           key: drop query and fragment, unread.
         - Cleanup not verifiable: keep nothing, flag the boot as blocked and
           reload the bare path. Nothing is stored or logged; other URLs are
           untouched. */
      (function () {
        try {
          var C = '/integrations/shopify/complete';
          var loc = window.location;
          var n = loc.pathname;
          try { n = decodeURIComponent(n); } catch (e) { /* compare raw */ }
          n = n.toLowerCase().replace(/\/{2,}/g, '/').replace(/\/+$/, '');
          var onPath = n === C;
          var marker = /shopify(?:_|%5f|%255f)(?:handle|connection)/i;
          if (!onPath && !marker.test(loc.hash) && !marker.test(loc.search)) return;
          var m = document.createElement('meta');
          m.name = 'referrer';
          m.content = 'no-referrer';
          document.head.appendChild(m);
          // Foreign paths: an explicit same-origin URL. A bare pathname that
          // starts with // would be read as protocol-relative (another host).
          var target = onPath ? C : loc.origin + loc.pathname;
          var held = onPath ? loc.hash : '';
          var clean = function () {
            return loc.hash === '' && loc.search === '' && (!onPath || loc.pathname === C);
          };
          if (!clean()) {
            try { window.history.replaceState(null, '', target); } catch (e) { /* verified below */ }
          }
          var blocked = !clean();
          if (blocked) held = '';
          Object.defineProperty(window, '__nahlaShopifyReturn', {
            configurable: true,
            value: function () {
              var v = held;
              held = '';
              try { delete window.__nahlaShopifyReturn; } catch (e) { /* ignore */ }
              return v;
            }
          });
          if (blocked) {
            Object.defineProperty(window, '__nahlaShopifyReturnBlocked', { value: true });
            try { loc.replace(target); } catch (e) { /* main.tsx stops the boot */ }
          }
        } catch (e) { /* bootCapture.ts repeats every check */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--

      Runtime route metadata is applied from publicSeo.ts before React mounts.

    <meta property="og:title" content="Nahlah AI | AI-powered WhatsApp Sales Platform" />
    <meta

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nahlah AI | AI-powered WhatsApp Sales Platform" />
    <meta
      name="twitter:description"

      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Salla embedded handshake — fires IMMEDIATELY when the iframe HTML loads,
      before React even bundles.  Salla's host frame shows
      "لم يتم الاتصال بالتطبيق" if app.ready doesn't arrive within ~5s.
      We send both event shapes (legacy + current SDK) and re-send at 1s/3s.
    -->
    <script>
      (function () {
        if (window.parent === window) return; // not in an iframe
        var send = function () {
          try {
            window.parent.postMessage(
              { event: 'embedded::ready', payload: {}, timestamp: Date.now(),
                source: 'embedded-app', metadata: { version: '0.2.4' } },
              '*'
            );
          } catch (e) {}
          try { window.parent.postMessage({ event: 'app.ready', type: 'app.ready' }, '*'); } catch (e) {}
        };
        send();
        setTimeout(send, 600);
        setTimeout(send, 2000);
        setTimeout(send, 5000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Skip SW inside Salla iframe to avoid first-load races
          if (window.parent !== window) return;
          navigator.serviceWorker.register('/sw.js?v=7').catch(function () {});
        });
      }
    </script>
  </body>
</html>
