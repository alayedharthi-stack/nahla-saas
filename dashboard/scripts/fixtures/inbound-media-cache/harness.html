<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbound Media Cache Isolation Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./harness.tsx"></script>
    <script>
      // Same registration as dashboard/index.html: the real, unmodified
      // public/sw.js, so the app's service worker is in the request path.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          if (window.parent !== window) return;
          navigator.serviceWorker.register('/sw.js?v=7').catch(function () {});
        });
      }
    </script>
  </body>
</html>
