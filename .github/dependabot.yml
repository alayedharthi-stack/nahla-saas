# ─────────────────────────────────────────────────────────────────────────────
# Phase 1A — Dependabot configuration
# ─────────────────────────────────────────────────────────────────────────────
# Automated weekly PRs for dependency updates with a security-first slant:
#
# * Python deps (root + backend) — weekly cadence, grouped to avoid PR
#   storms. Security advisories cut their own out-of-band PRs (Dependabot
#   does this automatically for any open ecosystem regardless of cadence).
# * npm deps (dashboard SPA) — same.
# * GitHub Actions — monthly is enough; CI pin churn is low.
#
# Notes:
# * The repository ships TWO requirements files (root for the AI services,
#   ``backend/requirements.txt`` for the API). Both are tracked.
# * Major version bumps for the auth stack (fastapi, sqlalchemy,
#   python-jose) are intentionally still allowed — Phase 2 will ship the
#   ``python-jose → PyJWT`` migration; until then we want visibility.
# * Reviewers / labels are left empty so the repo defaults apply.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "backend"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "dashboard"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
