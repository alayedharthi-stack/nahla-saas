name: PostgreSQL 18 compatibility

on:
  pull_request:
    branches: [main, master, ops/tenant1-haiku-20260921-f9021b59, review/salla-acceptance-efb8-governed-20261026, review/salla-ci-proofs-20261027, codex/salla-production-preserve-shopify-20261018, review/salla-app-first-ci-20261027]
  push:
    branches: [main, master, codex/salla-production-preserve-shopify-20261018]

permissions:
  contents: read

jobs:
  postgres-18-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: nahla
          POSTGRES_PASSWORD: nahla_password
          POSTGRES_DB: nahla_saas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nahla -d nahla_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt pytest
      - name: Strict inventory on PostgreSQL 18
        env:
          NAHLA_RELIABILITY_REQUIRE_PG: "1"
          NAHLA_RELIABILITY_PG_ADMIN_DSN: postgresql://nahla:nahla_password@127.0.0.1:5433/postgres
          CUSTOMER_NAME_PROVENANCE_PG_REQUIRED: "1"
          LEGACY_MIG_PG_TEST_DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/nahla_saas
        run: |
          set -euo pipefail
          python -c 'import os; import sqlalchemy as sa; e=sa.create_engine(os.environ["NAHLA_RELIABILITY_PG_ADMIN_DSN"]); c=e.connect(); v=int(c.exec_driver_sql("SHOW server_version_num").scalar()); print("PostgreSQL server_version_num=", v); assert 180000 <= v < 190000; c.close(); e.dispose()'
          python scripts/required_postgres_proofs.py \
            --manifest scripts/required_postgres_proofs.json \
            --junit-dir /tmp/required-postgres18-proofs \
            --report /tmp/required-postgres18-proofs/report.json
      - name: Salla acceptance races and Shopify rollback on PostgreSQL 18
        env:
          NAHLA_RELIABILITY_REQUIRE_PG: "1"
          NAHLA_RELIABILITY_PG_ADMIN_DSN: postgresql://nahla:nahla_password@127.0.0.1:5433/postgres
          NAHLA_RELEASE_GATE_PG_HOST_ALIAS: shopify-gate-disposable
          NAHLA_ACCEPTANCE_PG_URL: postgresql://acceptance:synthetic_acceptance_only@127.0.0.1:5433/acceptance_test
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ["NAHLA_RELIABILITY_PG_ADMIN_DSN"], isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.exec_driver_sql("CREATE ROLE acceptance LOGIN PASSWORD 'synthetic_acceptance_only'")
              conn.exec_driver_sql("CREATE DATABASE acceptance_test OWNER acceptance")
          engine.dispose()
          PY
          printf '127.0.0.1 shopify-gate-disposable\n' | sudo tee -a /etc/hosts >/dev/null
          mkdir -p "$RUNNER_TEMP/acceptance-pg18"
          python -B -m pytest backend/tests/test_shopify_install_release_pg.py -q -ra --tb=short \
            --junitxml="$RUNNER_TEMP/acceptance-pg18/rollback.xml"
          python scripts/check_junit_clean.py "$RUNNER_TEMP/acceptance-pg18/rollback.xml"
          python -B -m pytest tests/test_salla_comm_release_contract_0125.py \
            backend/tests/test_salla_comm_release_gate_0125_pg.py -q -ra --tb=short \
            --junitxml="$RUNNER_TEMP/acceptance-pg18/communication-release-gate.xml"
          python scripts/check_junit_clean.py "$RUNNER_TEMP/acceptance-pg18/communication-release-gate.xml"
          python -B -m pytest backend/tests/test_salla_comm_retained_0125_rollback_pg.py -q -ra --tb=short \
            --junitxml="$RUNNER_TEMP/acceptance-pg18/communication-retained-rollback.xml"
          python scripts/check_junit_clean.py "$RUNNER_TEMP/acceptance-pg18/communication-retained-rollback.xml"
          python -B -m pytest backend/tests/test_acceptance_order_coupon_identity.py -q -ra --tb=short \
            --junitxml="$RUNNER_TEMP/acceptance-pg18/acceptance.xml"
          python scripts/check_junit_clean.py "$RUNNER_TEMP/acceptance-pg18/acceptance.xml"
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-postgres18-proofs
          path: |
            /tmp/required-postgres18-proofs
            ${{ runner.temp }}/acceptance-pg18
          if-no-files-found: warn
