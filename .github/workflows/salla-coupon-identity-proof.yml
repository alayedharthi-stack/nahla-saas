name: Salla coupon identity proof
on:
  pull_request:
    branches: [main, master, codex/salla-production-preserve-shopify-20261018]
permissions:
  contents: read
jobs:
  coupon-runtime-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '16'
            image: public.ecr.aws/docker/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          - version: '18'
            image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: coupon_test
          POSTGRES_PASSWORD: coupon_test
          POSTGRES_DB: coupon_test
        ports: ['5433:5432']
        options: >-
          --health-cmd 'pg_isready -U coupon_test -d coupon_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements.txt pytest
      - name: Coupon runtime
        env:
          ENVIRONMENT: test
        run: |
          python -m pytest -q tests/test_salla_coupon_identity.py tests/test_coupon_active_sync.py tests/test_coupon_salla_two_way_sync.py tests/test_salla_coupons_poller.py tests/test_coupon_sync_visibility.py tests/test_coupon_source_filters.py tests/test_salla_coupon_discount_normalise.py --junitxml=/tmp/coupon-runtime.xml
          python scripts/check_junit_clean.py /tmp/coupon-runtime.xml
      - name: PostgreSQL identity, quarantine, rollback and concurrency
        env:
          A1_PG_INTEGRATION_REQUIRED: '1'
          A1_PG_TEST_DATABASE_URL: postgresql://coupon_test:coupon_test@127.0.0.1:5433/coupon_test
        run: |
          python -m pytest -q tests/test_salla_coupon_identity_pg.py tests/test_coupon_active_sync_pg.py tests/test_salla_coupon_retirement_pg.py --junitxml=/tmp/coupon-pg.xml
          python scripts/check_junit_clean.py /tmp/coupon-pg.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salla-coupon-pg${{ matrix.version }}-${{ github.event.pull_request.head.sha }}
          path: /tmp/coupon-*.xml
