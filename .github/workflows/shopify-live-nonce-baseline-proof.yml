name: Shopify live nonce baseline proof

on:
  push:
    branches: [codex/shopify-live-nonce-baseline-20261011]
    paths:
      - .github/workflows/shopify-live-nonce-baseline-proof.yml
      - scripts/operators/shopify_release_schema_expectations.json
      - tests/test_shopify_release_gate.py
      - backend/tests/test_shopify_release_gate_pg.py
      - backend/tests/test_shopify_startup_compatibility_pg.py

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: nahla
          POSTGRES_PASSWORD: nahla_password
          POSTGRES_DB: nahla_saas
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U nahla -d nahla_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCEPTED_SOURCE_SHA: e345ecf6f637b54b9c26d95906fb6143e0a48f09
      LEGACY_SOURCE_SHA: 462ede1aff602cad84e9569be859cca0087b190d
      NAHLA_STARTUP_SOURCE_ROOT: ${{ github.workspace }}/candidate
      NAHLA_LEGACY_462_CHECKOUT: ${{ github.workspace }}/legacy
      NAHLA_RELIABILITY_REQUIRE_PG: '1'
      NAHLA_RELIABILITY_PG_ADMIN_DSN: postgresql://nahla:nahla_password@127.0.0.1:5433/postgres
      NAHLA_RELEASE_GATE_PG_HOST_ALIAS: shopify-gate-disposable
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Fetch exact source and assert the single expectation delta
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for checkout_name in candidate legacy; do
            git init "$checkout_name"
            git -C "$checkout_name" config core.autocrlf false
            git -C "$checkout_name" remote add origin https://github.com/alayedharthi-stack/nahla-saas.git
          done
          git -C candidate fetch --no-tags --depth=1 origin "$GITHUB_SHA" "$ACCEPTED_SOURCE_SHA"
          git -C candidate checkout --detach "$GITHUB_SHA"
          git -C legacy fetch --no-tags --depth=1 origin "$LEGACY_SOURCE_SHA"
          git -C legacy checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_SOURCE_SHA"
          git -C candidate diff --exit-code "$ACCEPTED_SOURCE_SHA" HEAD -- \
            backend/main.py backend/core backend/services core database integrations requirements.txt start.sh Dockerfile \
            scripts/operators/shopify_release_gate.py scripts/operators/shopify_release_gate_contract.py \
            scripts/operators/shopify_release_gate_render.py
          git -C candidate show -s --format='candidate=%H tree=%T'
          git -C legacy show -s --format='legacy=%H tree=%T'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'

      - name: Install only focused proof dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/shopify-nonce-venv"
          echo "$RUNNER_TEMP/shopify-nonce-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shopify-nonce-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps \
            alembic==1.13.1 SQLAlchemy==2.0.30 psycopg2-binary==2.9.9 pytest==9.1.1 \
            Mako==1.4.3 MarkupSafe==3.0.4 greenlet==3.5.6 typing-extensions==4.16.0 \
            iniconfig==2.3.1 packaging==26.3 pluggy==1.6.0 Pygments==2.21.0 \
            cryptography==45.0.7 cffi==2.1.1 pycparser==3.11
          "$RUNNER_TEMP/shopify-nonce-venv/bin/python" -m pip check

      - name: Verify exact correction and PostgreSQL 18.6
        run: |
          set -euo pipefail
          printf '127.0.0.1 shopify-gate-disposable\n' | sudo tee -a /etc/hosts > /dev/null
          python - <<'PY'
          import copy,json,os,subprocess
          from pathlib import Path
          import sqlalchemy as sa
          path='scripts/operators/shopify_release_schema_expectations.json'
          original=json.loads(subprocess.check_output(['git','show',os.environ['ACCEPTED_SOURCE_SHA']+':'+path]))
          expected=copy.deepcopy(original)
          assert expected['retained']['nonce']['columns'][-1][0]=='created_at'
          assert expected['retained']['nonce']['columns'][-1][3]=='CURRENT_TIMESTAMP'
          expected['retained']['nonce']['columns'][-1][3]=None
          assert json.loads(Path(path).read_text())==expected
          engine=sa.create_engine(os.environ['NAHLA_RELIABILITY_PG_ADMIN_DSN'],poolclass=sa.pool.NullPool)
          with engine.connect() as conn:
              version=int(conn.exec_driver_sql('SHOW server_version_num').scalar())
              assert version==180006
              print('PostgreSQL server_version_num=',version)
          engine.dispose()
          PY

      - name: Run only five focused compatibility and drift tests
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          python -B -m pytest -q -s -ra --tb=short \
            tests/test_shopify_release_gate.py::test_retained_definitions_are_compared_by_definition_and_reported_by_name_only \
            tests/test_shopify_release_gate.py::test_expectations_file_is_bound_to_these_migrations_and_covers_retained_and_s3_relations \
            backend/tests/test_shopify_release_gate_pg.py::test_retained_definition_drift_is_refused_and_exact_restoration_passes \
            backend/tests/test_shopify_release_gate_pg.py::test_expectations_file_equals_fresh_snapshots_on_this_server \
            backend/tests/test_shopify_startup_compatibility_pg.py::test_adopted_nonce_survives_s0_to_s3_without_fixture_reset \
            --junitxml="$RUNNER_TEMP/shopify-nonce.xml"
          python scripts/check_junit_clean.py "$RUNNER_TEMP/shopify-nonce.xml"
          python -c 'import os; from scripts.check_junit_clean import evaluate_junit_report as check; result=check(os.environ["RUNNER_TEMP"]+"/shopify-nonce.xml"); print(result); assert result["ok"] and result["tests"] == 5'
          date -u +'%Y-%m-%dT%H:%M:%SZ'

      - name: Verify source stayed unchanged
        if: always()
        run: |
          git diff --exit-code
          git -C ../legacy diff --exit-code
