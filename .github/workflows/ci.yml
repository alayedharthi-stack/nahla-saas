name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        # Pinned to 3.12 because the production stack pins
        # `pydantic==2.7.1` / `pydantic-core==2.18.x`,
        # `psycopg2-binary==2.9.9`, and `bcrypt==4.1.3`. None of those
        # publish cp313 wheels, so 3.13 forces a from-source build that
        # needs Rust + libpq headers and breaks `pip install` in CI.
        # Bump back to 3.13 once the stack is upgraded (pydantic >= 2.9,
        # psycopg2-binary >= 2.9.10, bcrypt >= 4.2).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      # Guardrail from ADR 0001: no new silent except Exception swallowers.
      # The baseline captures the 42 pre-existing offenders at the time of
      # the durable-webhook-queue rollout. CI fails if a new commit adds
      # another silent swallow without a `# noqa: silent-ok` justification.
      - name: Lint — no new silent excepts
        run: python scripts/lint_no_silent_except.py

      - name: Run unit tests (verbose, capture full output)
        id: pytest
        run: |
          python -m pytest --collect-only -q > pytest-collect.txt 2>&1 || true
          set +e
          python -m pytest -v --maxfail=1 --tb=long -rA 2>&1 | tee pytest-output.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        shell: bash

      - name: Push debug logs to ci-debug branch (orphan)
        if: always()
        run: |
          set -e
          mkdir -p _debug
          cp pytest-collect.txt _debug/ 2>/dev/null || true
          cp pytest-output.txt _debug/ 2>/dev/null || true
          cd _debug
          git init -q
          git config user.email "ci@nahla.local"
          git config user.name "CI Debug Bot"
          echo "# CI debug for $GITHUB_SHA" > README.md
          echo "Run: $GITHUB_RUN_ID  Status: pytest_rc=${{ steps.pytest.outputs.rc }}" >> README.md
          git add -A
          git commit -q -m "ci-debug: $GITHUB_SHA run=$GITHUB_RUN_ID"
          git branch -M ci-debug
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-debug
        shell: bash

      - name: Fail the job if pytest failed
        if: steps.pytest.outputs.rc != '0'
        run: |
          echo "pytest exited with rc=${{ steps.pytest.outputs.rc }}"
          exit 1
        shell: bash
