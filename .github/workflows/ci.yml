name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        # Pinned to 3.12 because the production stack pins
        # `pydantic==2.7.1` / `pydantic-core==2.18.x`,
        # `psycopg2-binary==2.9.9`, and `bcrypt==4.1.3`. None of those
        # publish cp313 wheels, so 3.13 forces a from-source build that
        # needs Rust + libpq headers and breaks `pip install` in CI.
        # Bump back to 3.13 once the stack is upgraded (pydantic >= 2.9,
        # psycopg2-binary >= 2.9.10, bcrypt >= 4.2).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      # Guardrail from ADR 0001: no new silent except Exception swallowers.
      # The baseline captures the pre-existing offenders. CI fails if a new
      # commit adds another silent swallow without a `# noqa: silent-ok`
      # justification.
      - name: Lint — no new silent excepts
        run: python scripts/lint_no_silent_except.py

      - name: Run unit tests
        run: python -m pytest -q --maxfail=1

      - name: Manual gift grant permanence tests
        run: |
          python -m pytest \
            backend/tests/test_manual_billing_grant.py \
            backend/tests/test_admin_manual_gift_grant.py \
            backend/tests/test_admin_tenant_list_billing_badge.py \
            -v --tb=short --maxfail=1

      - name: Orders list newest-first tests
        run: |
          python -m pytest \
            backend/tests/test_orders_list_empty_after_date_sort.py \
            -v --tb=short --maxfail=1 \
            --junitxml=/tmp/orders-list-newest-first.xml

      - name: Salla PR 888 remediation unit tests
        run: |
          python -m pytest \
            backend/tests/test_salla_pr888_remaining_remediation.py \
            backend/tests/test_salla_pr888_remediation.py \
            backend/tests/test_salla_realtime_commerce.py \
            -v --tb=short --maxfail=1 \
            --junitxml=/tmp/salla-pr888-remediation.xml

      - name: Customer conditional coupon Layer 0 consumer tests
        run: |
          python -m pytest \
            backend/tests/test_customer_conditional_coupon_layer0.py \
            backend/tests/test_customer_conditional_coupon_subject_bridge_consumer.py \
            backend/tests/test_customer_conditional_coupon_shadow_readiness.py \
            backend/tests/test_customer_conditional_coupon_shadow_deployment_artifact.py \
            backend/tests/test_customer_conditional_coupon_compose_projection.py \
            backend/tests/test_customer_conditional_coupon_compose_wiring.py \
            backend/tests/test_customer_conditional_coupon_compose_eval_fixtures.py \
            backend/tests/test_customer_conditional_coupon_compose_provenance_integration.py \
            backend/tests/test_customer_conditional_coupon_compose_collision.py \
            backend/tests/test_customer_conditional_coupon_compose_guards.py \
            backend/tests/test_customer_conditional_coupon_general_llm_evidence_guard.py \
            -q --maxfail=1

      - name: Coupon shadow observation probe tests
        run: |
          python -m pytest \
            backend/tests/test_customer_conditional_coupon_shadow_observation_probe.py \
            -q --maxfail=1

      - name: Conditional coupon consumer verify operator tests
        run: |
          python -m pytest \
            backend/tests/test_deployment_revision_attestation.py \
            backend/tests/test_customer_conditional_coupon_consumer_verify.py \
            -q --maxfail=1

      - name: Real-channel conversational acceptance probe tests
        run: |
          python -m pytest \
            backend/tests/test_real_channel_conversational_acceptance_probe.py \
            backend/tests/test_real_channel_acceptance_session.py \
            -q --maxfail=1

      - name: Guarded staging migration operator tests
        run: |
          python -m pytest backend/tests/test_staging_migration_0016_to_0024_operator.py -q --maxfail=1
          python -m pytest backend/tests/test_staging_migration_0024_to_0030_operator.py -q --maxfail=1
          python -m pytest backend/tests/test_staging_migration_0030_to_0087_operators.py -q --maxfail=1
          python -m pytest backend/tests/test_staging_migration_0088_to_0089_operators.py -q --maxfail=1

      - name: Tenant merchant clone operator tests
        run: |
          python -m pytest backend/tests/test_tenant_merchant_clone_operator.py -q --maxfail=1

      - name: Staging DR canonical parity unit tests
        run: |
          python -m pytest backend/tests/test_staging_dr_canonical_parity.py -q --maxfail=1
          python -m pytest backend/tests/test_staging_dr_executor_image.py -q --maxfail=1

  staging-dr-executor-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build closed DR executor artifact
        working-directory: ops/staging_dr_executor
        run: docker build -t nahla-staging-dr-executor:ci .

      - name: Verify executor image scripts and long-running entrypoint
        run: |
          set -euo pipefail
          for script in backup.sh restore_verify.sh target_preflight.sh common.sh idle.sh verify_canonical_parity.sh; do
            docker run --rm nahla-staging-dr-executor:ci test -x "/dr/scripts/${script}"
          done
          docker run --rm nahla-staging-dr-executor:ci test -f /dr/contracts/canonical_parity.json
          docker run --rm nahla-staging-dr-executor:ci grep -q 'exec sleep infinity' /dr/scripts/idle.sh
          docker run --rm nahla-staging-dr-executor:ci which aws
          docker run --rm nahla-staging-dr-executor:ci which jq

  constitution-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      - name: Constitution compliance
        run: python -m pytest backend/tests/test_constitution_compliance.py -q

  trusted-context-layer1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      - name: Layer 1 Trusted Context validation
        run: |
          python -m pytest \
            backend/tests/test_trusted_context_layer1_mass_validation.py \
            backend/tests/test_trusted_context_layer1_golden.py \
            backend/tests/test_trusted_context_shadow_wireup.py \
            backend/tests/test_trusted_context_coupons_promotions.py \
            -m trusted_context_layer1 \
            -q --maxfail=1

  a1-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nahla
          POSTGRES_PASSWORD: nahla_password
          POSTGRES_DB: nahla_saas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nahla -d nahla_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/nahla_saas
      A1_PG_INTEGRATION_REQUIRED: "1"
      A1_PG_TEST_DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/nahla_saas
      TENANT_CLONE_PG_SOURCE_DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/tenant_clone_source
      TENANT_CLONE_PG_TARGET_DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/tenant_clone_target
      LEGACY_MIG_PG_INTEGRATION_REQUIRED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest alembic

      # Parallel heads: 0092 (A1-Validate) and 0093 (bindings). Pin CI to 0093
      # so capability stays expand; never use bare `head` here.
      - name: Apply integration migration path (0093 only)
        working-directory: database
        run: python -m alembic upgrade 0093

      - name: Prepare tenant clone source and target databases
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text

          engine = create_engine(
              "postgresql://nahla:nahla_password@127.0.0.1:5433/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with engine.connect() as conn:
              conn.execute(text("CREATE DATABASE tenant_clone_source"))
              conn.execute(text("CREATE DATABASE tenant_clone_target"))
          PY
          for database_name in tenant_clone_source tenant_clone_target; do
            (
              cd database
              export DATABASE_URL="postgresql://nahla:nahla_password@127.0.0.1:5433/${database_name}"
              python -m alembic upgrade 0088
              python -m alembic upgrade 0093
            )
          done

      - name: WhatsApp provider schema PostgreSQL migration suite
        run: |
          python -m pytest \
            backend/tests/test_whatsapp_connections_provider_schema_pg.py \
            -q --maxfail=1 -W error::sqlalchemy.exc.SAWarning

      - name: A1-v3.7 PostgreSQL integration
        run: |
          python -m pytest \
            backend/tests/test_internal_conversational_e2e_sql_error_audit.py \
            backend/tests/test_order_customer_identity_postgres_integration.py \
            backend/tests/test_order_customer_identity_log_privacy.py \
            backend/tests/test_order_customer_identity_ingest_regression.py \
            backend/tests/test_order_customer_identity_legacy_customer_sync.py \
            backend/tests/test_order_customer_identity_migration_pg.py \
            backend/tests/test_order_customer_identity_migration_validate_pg.py \
            backend/tests/test_cross_merchant_model_path_hotfix_pg.py \
            backend/tests/test_staging_migration_0087_to_0088_operators.py \
            backend/tests/test_staging_migration_0088_to_0089_attach_pg.py \
            backend/tests/test_conversation_a1_subject_binding_migration_pg.py \
            backend/tests/test_conversation_a1_subject_read_bridge_postgres.py \
            backend/tests/test_coupon_pool_cap_postgres.py \
            backend/tests/test_salla_coupons_poller_race_postgres.py \
            backend/tests/test_salla_commerce_reconciler_postgres.py \
            backend/tests/test_salla_cart_recovery_postgres.py \
            backend/tests/test_salla_delete_401_refresh_postgres.py \
            backend/tests/test_salla_delete_401_branch_closure_postgres.py \
            backend/tests/test_customer_conditional_coupon_a1_pg_e2e.py \
            backend/tests/test_legacy_migration_drift_0020_0024_pg.py \
            backend/tests/test_legacy_migration_drift_0025_0030_pg.py \
            backend/tests/test_legacy_migration_drift_0032_0083_pg.py \
            backend/tests/test_staging_migration_0032_to_0083_operator.py \
            backend/tests/test_legacy_migration_drift_0030_0087_pg.py \
            backend/tests/test_staging_dr_canonical_parity_pg.py \
            backend/tests/test_order_customer_identity_capability_gate.py \
            backend/tests/test_order_customer_identity_reconciliation_report.py \
            backend/tests/test_order_customer_identity_reconciliation_write.py \
            backend/tests/test_order_customer_identity_evidence_fixture.py \
            backend/tests/test_customer_conditional_coupon_shadow_fixture.py \
            backend/tests/test_webhook_dispatcher_a1_connection_resolution.py \
            backend/tests/test_real_channel_acceptance_session_pg.py \
            backend/tests/test_tenant_merchant_clone_operator.py \
            backend/tests/test_salla_integration_resolver_ambiguity.py \
            "backend/tests/test_customer_commerce_ledger.py::TestLedgerOrderingPostgres" \
            -q --maxfail=1 -W error::sqlalchemy.exc.SAWarning \
            --junitxml=/tmp/a1-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("/tmp/a1-postgres.xml")
          if not xml_path.exists():
              raise SystemExit("missing A1 JUnit file; cannot prove H3 case names")
          print("H3 PostgreSQL case names from test_salla_cart_recovery_postgres.py:")
          found = 0
          for tc in ET.parse(xml_path).getroot().iter("testcase"):
              classname = tc.get("classname") or ""
              name = tc.get("name") or ""
              file_attr = tc.get("file") or ""
              hay = classname + " " + file_attr
              if "salla_cart_recovery_postgres" not in hay:
                  continue
              found += 1
              if tc.find("failure") is not None:
                  status = "FAILED"
              elif tc.find("error") is not None:
                  status = "ERROR"
              elif tc.find("skipped") is not None:
                  status = "SKIPPED"
              else:
                  status = "PASSED"
              print(f"  {status} {classname}::{name}")
          if found == 0:
              raise SystemExit("A1 JUnit contained no cart-recovery postgres cases")
          PY

      # Dedicated PG16 proof for lifecycle CAS claims. Uses a fresh database so
      # migration_0094_required stays on 0093 while CAS races upgrade to 0094.
      # Any skip (missing PG / fixtures / env) fails this step.
      - name: Orders list newest-first PostgreSQL tests
        run: |
          python -m pytest \
            backend/tests/test_orders_list_newest_first_postgres.py \
            -v --tb=short --maxfail=1 \
            --junitxml=/tmp/orders-list-newest-first-pg.xml

      - name: Commerce lifecycle CAS concurrency - PostgreSQL
        env:
          A1_PG_INTEGRATION_REQUIRED: "1"
          A1_PG_TEST_DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/lifecycle_cas
          DATABASE_URL: postgresql://nahla:nahla_password@127.0.0.1:5433/lifecycle_cas
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import create_engine, text

          admin = create_engine(
              "postgresql://nahla:nahla_password@127.0.0.1:5433/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with admin.connect() as conn:
              conn.execute(text("DROP DATABASE IF EXISTS lifecycle_cas WITH (FORCE)"))
              conn.execute(text("CREATE DATABASE lifecycle_cas"))
          PY

          assert_no_skips() {
            local file="$1"
            local expected_passed="$2"
            if grep -E 'skipped' "$file"; then
              echo "FAIL: unexpected skip in commerce lifecycle CAS PostgreSQL proof"
              exit 1
            fi
            if ! grep -E "${expected_passed} passed" "$file"; then
              echo "FAIL: expected ${expected_passed} passed in commerce lifecycle CAS PostgreSQL proof"
              exit 1
            fi
          }

          # 1) migration_0094_required on 0093-only schema (fixture pins 0093)
          python -m pytest \
            backend/tests/test_commerce_lifecycle_ledger_cas_concurrency.py::TestMigration0094GuardPostgres \
            -q --maxfail=1 -W error::sqlalchemy.exc.SAWarning \
            | tee /tmp/lifecycle_cas_0093.txt
          assert_no_skips /tmp/lifecycle_cas_0093.txt 1

          # Fresh DB for 0094 CAS races so schema upgrade starts cleanly.
          python - <<'PY'
          from sqlalchemy import create_engine, text

          admin = create_engine(
              "postgresql://nahla:nahla_password@127.0.0.1:5433/postgres",
              isolation_level="AUTOCOMMIT",
          )
          with admin.connect() as conn:
              conn.execute(text("DROP DATABASE IF EXISTS lifecycle_cas WITH (FORCE)"))
              conn.execute(text("CREATE DATABASE lifecycle_cas"))
          PY

          # 2) CAS races on 0094 (fixture upgrades 0093 -> 0094 in this process)
          python -m pytest \
            backend/tests/test_commerce_lifecycle_ledger_cas_concurrency.py::TestShadowPromotionCasPostgres \
            backend/tests/test_commerce_lifecycle_ledger_cas_concurrency.py::TestMarkSendSendingCasPostgres \
            backend/tests/test_commerce_lifecycle_ledger_cas_concurrency.py::TestDispatchProviderCasPostgres \
            -q --maxfail=1 -W error::sqlalchemy.exc.SAWarning \
            | tee /tmp/lifecycle_cas_0094.txt
          assert_no_skips /tmp/lifecycle_cas_0094.txt 3

          echo "4 passed, 0 skipped"

  whatsapp-catalog-sync-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wa_catalog
          POSTGRES_PASSWORD: wa_catalog_itest
          POSTGRES_DB: wa_catalog_sync_itest
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U wa_catalog -d wa_catalog_sync_itest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WA_CATALOG_SYNC_PG_REQUIRED: "1"
      WA_CATALOG_SYNC_PG_TEST_DATABASE_URL: postgresql+psycopg2://wa_catalog:wa_catalog_itest@127.0.0.1:5434/wa_catalog_sync_itest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest

      - name: WhatsApp catalog sync PostgreSQL locks
        run: |
          set -euo pipefail
          unset DATABASE_URL || true
          python -m pytest \
            backend/tests/test_whatsapp_catalog_sync_postgres_locks.py \
            backend/tests/test_meta_catalog_identity_postgres.py \
            -q --tb=short --maxfail=1 \
            --junitxml=/tmp/wa-catalog-pg.xml
          python scripts/check_junit_clean.py /tmp/wa-catalog-pg.xml

  # Dashboard Route/Nav/Page Metadata + product identity + platform telemetry/flags.
  # Source-level regression scripts (tsx via npx); no npm ci / full build.
  # Does not run AI, backend, migrations, or deploy steps.
  dashboard-platform-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run platform policy checks
        run: npm run check:platform-policy
